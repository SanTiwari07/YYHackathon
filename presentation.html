<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroStruxure deck viewer</title>
<style>
  :root { --bg:#0b2a22; --fg:#e9f4ee; --muted:#9fc2b2; --accent:#3dcd58; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: Calibri, "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:16px; align-items:center; justify-content:space-between; padding:10px 16px; font-size:14px; }
  header a { color:var(--accent); text-decoration:none; margin-left:14px; }
  header a:hover, header a:focus-visible { text-decoration:underline; }
  main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 16px; }
  img { max-width:100%; max-height:100%; aspect-ratio:16/9; object-fit:contain; border-radius:6px; background:#000; }
  footer { display:flex; gap:12px; align-items:center; justify-content:center; padding:10px 16px 14px; font-size:14px; color:var(--muted); }
  button { background:#14473a; color:var(--fg); border:1px solid #2a6b58; border-radius:6px; padding:6px 14px; font:inherit; cursor:pointer; }
  button:hover, button:focus-visible { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <strong>AgroStruxure™ · Yuva Yodha 2026 · Challenge 01</strong>
  <span>
    <a href="AgroStruxure_YuvaYodha_2026_Final.pptx">Download PPTX (editable)</a>
    <a href="AgroStruxure_YuvaYodha_2026_Final.pdf">Download PDF</a>
  </span>
</header>
<main><img id="slide" alt=""></main>
<footer>
  <button id="prev" aria-label="Previous slide">&larr; Prev</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" aria-label="Next slide">Next &rarr;</button>
  <span>Use the arrow keys, Space or Home/End.</span>
</footer>
<script>
  var titles = [
    "Title: AgroStruxure, solar-synchronised agri-energy microgrid and precision irrigation",
    "Problem: free solar power accelerates groundwater collapse",
    "Architecture: data, energy and money flows",
    "Hydrology: 41.2% less groundwater, full crop requirement met",
    "Power engineering: cooling a four-farm cluster uses 26% of one farm's idle solar",
    "Cold chain: halving farm-gate tomato spoilage from 8.37% to 4.00%",
    "Vernacular advice grounded in hardware truth",
    "Unit economics: 50,212 rupees net capex per farm, payback in 2.0 years",
    "Deployment: from digital twin to a 250-farm pilot",
    "Summary: one solar pump, four measured outcomes"
  ];
  var i = 0, img = document.getElementById("slide"), count = document.getElementById("count");
  function show(n) {
    i = Math.max(0, Math.min(titles.length - 1, n));
    img.src = "presentation/qa/slide_" + String(i + 1).padStart(2, "0") + ".png";
    img.alt = titles[i];
    count.textContent = (i + 1) + " / " + titles.length;
    try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  }
  document.getElementById("prev").onclick = function () { show(i - 1); };
  document.getElementById("next").onclick = function () { show(i + 1); };
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", "PageDown", " "].indexOf(e.key) > -1) { e.preventDefault(); show(i + 1); }
    else if (["ArrowLeft", "PageUp"].indexOf(e.key) > -1) { e.preventDefault(); show(i - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(titles.length - 1);
  });
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
