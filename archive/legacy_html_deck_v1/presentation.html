<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroStruxure™ | Yuva Yodha Hackathon 2026 Pitch Deck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070B0D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #presentation-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #stage-scaler {
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      position: absolute;
      box-shadow: 0 25px 70px rgba(0,0,0,0.8);
      background: #000;
    }
    .slide-frame {
      width: 1920px;
      height: 1080px;
      border: none;
      display: none;
      position: absolute;
      top: 0; left: 0;
    }
    .slide-frame.active {
      display: block;
    }
    #nav-controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 22, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 1000;
      color: #FFFFFF;
      font-size: 14px;
      font-family: monospace;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    #nav-controls:hover { opacity: 1; }
    .nav-btn {
      background: none;
      border: none;
      color: #3DCD58;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <div id="presentation-viewport">
    <div id="stage-scaler">
      <iframe class="slide-frame active" id="frame-1" src="presentation/source/slides/slide_01.html"></iframe>
      <iframe class="slide-frame" id="frame-2" src="presentation/source/slides/slide_02.html"></iframe>
      <iframe class="slide-frame" id="frame-3" src="presentation/source/slides/slide_03.html"></iframe>
      <iframe class="slide-frame" id="frame-4" src="presentation/source/slides/slide_04.html"></iframe>
      <iframe class="slide-frame" id="frame-5" src="presentation/source/slides/slide_05.html"></iframe>
      <iframe class="slide-frame" id="frame-6" src="presentation/source/slides/slide_06.html"></iframe>
      <iframe class="slide-frame" id="frame-7" src="presentation/source/slides/slide_07.html"></iframe>
      <iframe class="slide-frame" id="frame-8" src="presentation/source/slides/slide_08.html"></iframe>
      <iframe class="slide-frame" id="frame-9" src="presentation/source/slides/slide_09.html"></iframe>
      <iframe class="slide-frame" id="frame-10" src="presentation/source/slides/slide_10.html"></iframe>
    </div>
  </div>

  <div id="nav-controls">
    <button class="nav-btn" onclick="prevSlide()">&larr; Prev</button>
    <span id="slide-indicator">01 / 10</span>
    <button class="nav-btn" onclick="nextSlide()">Next &rarr;</button>
    <span style="color: #64748B; font-size: 12px;">(Arrow Keys / Space)</span>
  </div>

  <script>
    let currentSlide = 1;
    const totalSlides = 10;

    function updateScale() {
      const scaler = document.getElementById('stage-scaler');
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scale = Math.min(w / 1920, h / 1080);
      scaler.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', updateScale);
    updateScale();

    function showSlide(n) {
      if (n < 1 || n > totalSlides) return;
      currentSlide = n;
      for (let i = 1; i <= totalSlides; i++) {
        const frame = document.getElementById(`frame-${i}`);
        if (i === n) {
          frame.classList.add('active');
        } else {
          frame.classList.remove('active');
        }
      }
      document.getElementById('slide-indicator').innerText = `${String(n).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
    }

    function nextSlide() { showSlide(currentSlide + 1); }
    function prevSlide() { showSlide(currentSlide - 1); }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'Home') {
        showSlide(1);
      } else if (e.key === 'End') {
        showSlide(totalSlides);
      }
    });
  </script>
</body>
</html>
